<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>🎵 音乐播放器</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #1e1e1e;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: 140px; /* 为底部控制栏留出更多空间 */
            overflow: hidden;
        }

        /* 歌曲信息区域 */
        .song-info {
            padding: 30px 20px 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            min-height: 100px;
        }

        .song-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 1em;
            color: #cccccc;
        }

        /* 歌词区域 - 大幅扩大 */
        .lyrics-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin: 10px 20px;
            min-height: 350px; /* 增加最小高度 */
            max-height: none; /* 移除最大高度限制 */
        }

        .lyrics-container {
            height: 100%;
            position: relative;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .lyrics-content {
            width: 100%;
            text-align: center;
            padding: 30px 0; /* 增加上下留白 */
        }

        .lyrics-line {
            padding: 12px 0; /* 增加行间距 */
            color: #cccccc;
            font-size: 1.1em; /* 增大字体 */
            line-height: 1.8; /* 增加行高 */
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 4px 0;
            border-radius: 8px;
        }

        .lyrics-line.active {
            color: #00ff88;
            font-weight: bold;
            transform: scale(1.05);
            background: rgba(0, 255, 136, 0.15);
            padding: 15px 12px;
            font-size: 1.2em; /* 当前歌词更大 */
        }

        .lyrics-line:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* 滚动条样式 */
        .lyrics-container::-webkit-scrollbar {
            width: 6px;
        }

        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .lyrics-container::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.5);
            border-radius: 3px;
        }

        /* 进度条区域 */
        .progress-section {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            color: #ffffff;
        }

        .progress-container {
            position: relative;
            height: 8px; /* 增加进度条高度 */
            background: #555555;
            border-radius: 4px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 3px solid #00ff88;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-container:hover .progress-thumb, .is-dragging .progress-thumb {
            opacity: 1;
        }

        /* 侧滑歌单容器 */
        .playlist-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%; /* 增加宽度 */
            max-width: 380px;
            height: 100vh;
            background: #1e1e1e;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .playlist-sidebar.open {
            right: 0;
        }

        .playlist-header {
            padding: 25px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #00ff88;
        }

        .close-playlist {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.8em;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .close-playlist:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-content {
            padding: 15px 0;
        }

        /* 歌单搜索框 */
        .playlist-search {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .playlist-search-input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 20px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .playlist-search-input:focus {
            border-color: #00ff88;
            background: rgba(255, 255, 255, 0.15);
        }

        .playlist-search-input::placeholder {
            color: #999999;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .playlist-item:hover {
            background-color: rgba(0, 255, 136, 0.1);
        }

        .playlist-item.active {
            background-color: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .playlist-item .song-number {
            width: 40px;
            font-size: 0.85em;
            color: #999999;
            text-align: center;
        }

        .playlist-item .song-name {
            flex: 1;
            font-size: 0.95em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 12px;
        }

        /* 遮罩层 */
        .playlist-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .playlist-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 底部固定控制栏 */
        .controls-section {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            padding: 20px 20px 25px;
            gap: 12px;
        }

        .main-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(0, 255, 136, 0.3);
            transform: scale(1.05);
        }

        .play-btn {
            width: 70px;
            height: 70px;
            font-size: 1.8em;
            background: rgba(0, 255, 136, 0.2);
        }

        .playlist-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-toggle-btn.active {
            background: rgba(0, 255, 136, 0.3);
        }

        .status-bar {
            font-size: 0.85em;
            color: #999999;
            text-align: center;
            padding: 8px 0;
        }

        /* 移动端响应式优化 */
        @media (max-width: 480px) {
            .song-info {
                padding: 20px 15px 15px;
                min-height: 80px;
            }
            
            .song-title {
                font-size: 1.3em;
            }
            
            .lyrics-section {
                margin: 8px 15px;
                padding: 12px 15px;
                min-height: 320px;
            }
            
            .lyrics-line {
                font-size: 1.05em;
                padding: 10px 0;
            }
            
            .lyrics-line.active {
                font-size: 1.15em;
            }
            
            .controls-wrapper {
                padding: 15px 15px 20px;
                gap: 10px;
            }
            
            .main-controls {
                gap: 12px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2em;
            }
            
            .play-btn {
                width: 60px;
                height: 60px;
                font-size: 1.6em;
            }
            
            .playlist-sidebar {
                width: 90%;
            }
        }

        /* 超小屏幕优化 */
        @media (max-width: 360px) {
            .lyrics-section {
                min-height: 280px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 1.1em;
            }
            
            .play-btn {
                width: 55px;
                height: 55px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="song-info">
                <div class="song-title" id="songTitle">选择一首歌曲</div>
                <div class="song-artist" id="songArtist">未知艺术家</div>
            </div>

            <div class="lyrics-section" id="lyricsSection">
                <div class="lyrics-container" id="lyricsContainer">
                    <div class="lyrics-content" id="lyricsContent">
                        <div class="lyrics-line">暂无歌词</div>
                    </div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-thumb" id="progressThumb"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="totalTime">00:00</span>
                </div>
            </div>
        </div>

        <!-- 底部固定控制栏 -->
        <div class="controls-section">
            <div class="controls-wrapper">
                <div class="main-controls">
                    <button class="control-btn mode-btn" id="modeBtn">🔁</button>
                    <button class="control-btn" id="prevBtn">⏮️</button>
                    <button class="control-btn play-btn" id="playBtn">▶️</button>
                    <button class="control-btn" id="nextBtn">⏭️</button>
                    <button class="control-btn playlist-toggle-btn" id="playlistToggleBtn">📋</button>
                </div>
                <div class="status-bar" id="statusBar">就绪</div>
            </div>
        </div>
    </div>

    <!-- 侧滑歌单 -->
    <div class="playlist-overlay" id="playlistOverlay"></div>
    <div class="playlist-sidebar" id="playlistSidebar">
        <div class="playlist-header">
            <div class="playlist-title">📋 播放列表</div>
            <button class="close-playlist" id="closePlaylist">✕</button>
        </div>
        <div class="playlist-search">
            <input type="text" class="playlist-search-input" id="playlistSearchInput" placeholder="搜索播放列表...">
        </div>
        <div class="playlist-content">
            <div id="playlist"></div>
        </div>
    </div>

    <script>
        class MobileMusicPlayer {
            constructor() {
                this.audio = new Audio();
                this.playlistData = [];
                this.currentIndex = 0;
                this.isPlaying = false;
                this.playMode = 0;
                this.modeIcons = ['🔁', '🔀', '🔂'];
                this.isDragging = false;
                
                // 添加新属性
                this.lyrics = [];
                this.currentLyricIndex = -1;
                this.filteredPlaylist = [];
                
                this.initializeElements();
                this.bindEvents();
                this.loadLocalPlaylist();
                this.setupAudioEvents();
            }
            
            initializeElements() {
                this.container = document.querySelector('.container');
                this.songTitle = document.getElementById('songTitle');
                this.songArtist = document.getElementById('songArtist');
                this.currentTime = document.getElementById('currentTime');
                this.totalTime = document.getElementById('totalTime');
                this.progressContainer = document.getElementById('progressContainer');
                this.progressBar = document.getElementById('progressBar');
                this.progressThumb = document.getElementById('progressThumb');
                this.playlistElement = document.getElementById('playlist');
                this.playBtn = document.getElementById('playBtn');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.modeBtn = document.getElementById('modeBtn');
                this.statusBar = document.getElementById('statusBar');
                this.lyricsContent = document.getElementById('lyricsContent');
                this.playlistToggleBtn = document.getElementById('playlistToggleBtn');
                this.playlistSidebar = document.getElementById('playlistSidebar');
                this.playlistOverlay = document.getElementById('playlistOverlay');
                this.closePlaylist = document.getElementById('closePlaylist');
                this.playlistSearchInput = document.getElementById('playlistSearchInput');
                this.isPlaylistVisible = false;
            }
            
            bindEvents() {
                this.playBtn.addEventListener('click', () => this.togglePlay());
                this.prevBtn.addEventListener('click', () => this.previousSong());
                this.nextBtn.addEventListener('click', () => this.nextSong());
                this.modeBtn.addEventListener('click', () => this.togglePlayMode());
                this.playlistToggleBtn.addEventListener('click', () => this.togglePlaylist());
                this.closePlaylist.addEventListener('click', () => this.togglePlaylist());
                this.playlistOverlay.addEventListener('click', () => this.togglePlaylist());
                
                // 播放列表搜索功能绑定
                this.playlistSearchInput.addEventListener('input', (e) => this.handleSearch(e.target.value));
                
                this.progressContainer.addEventListener('mousedown', (e) => this.handleDragStart(e));
                document.addEventListener('mousemove', (e) => this.handleDragMove(e));
                document.addEventListener('mouseup', () => this.handleDragEnd());
                this.progressContainer.addEventListener('touchstart', (e) => this.handleDragStart(e.touches[0]), { passive: true });
                document.addEventListener('touchmove', (e) => this.handleDragMove(e.touches[0]));
                document.addEventListener('touchend', () => this.handleDragEnd());
            }
            
            setupAudioEvents() {
                this.audio.addEventListener('loadedmetadata', () => {
                    this.totalTime.textContent = this.formatTime(this.audio.duration);
                    this.setupMediaSession();
                });
                
                this.audio.addEventListener('timeupdate', () => {
                    if (!this.isDragging) {
                        this.updateProgress();
                        this.updateLyrics();
                    }
                });
                
                this.audio.addEventListener('ended', () => this.handleSongEnd());
                this.audio.addEventListener('error', () => this.statusBar.textContent = '播放出错');
                
                this.audio.addEventListener('play', () => {
                    console.log('开始播放，当前歌词数量:', this.lyrics.length);
                });
            }

            // 歌词加载方法
            async loadLyrics(songUrl) {
                try {
                    const lrcUrl = songUrl.replace('.mp3', '.lrc');
                    console.log('正在加载歌词:', lrcUrl);
                    
                    const response = await fetch('./' + lrcUrl);
                    if (response.ok) {
                        const lrcText = await response.text();
                        console.log('原始歌词内容长度:', lrcText.length);
                        console.log('前200字符:', lrcText.substring(0, 200));
                        
                        this.lyrics = this.parseLRC(lrcText);
                        console.log('解析后的歌词数量:', this.lyrics.length);
                        console.log('前5行歌词:', this.lyrics.slice(0, 5));
                        
                        if (this.lyrics.length > 0) {
                            this.displayLyrics();
                            this.statusBar.textContent = `已加载 ${this.lyrics.length} 行歌词`;
                        } else {
                            this.displayNoLyrics();
                            this.statusBar.textContent = '歌词格式无法解析';
                        }
                    } else {
                        console.warn('歌词文件不存在:', lrcUrl);
                        this.lyrics = [];
                        this.displayNoLyrics();
                        this.statusBar.textContent = '未找到歌词文件';
                    }
                } catch (error) {
                    console.error('加载歌词失败:', error);
                    this.lyrics = [];
                    this.displayNoLyrics();
                    this.statusBar.textContent = '歌词加载失败';
                }
            }

            // LRC歌词解析
            parseLRC(lrcText) {
                const lines = lrcText.split('\n');
                const lyrics = [];
                
                lines.forEach(line => {
                    let timeMatch, time, text;
                    
                    // 检测三位毫秒格式 [mm:ss.xxx]
                    timeMatch = line.match(/\[(\d{2}):(\d{2})\.(\d{3})\](.*)/);
                    if (timeMatch) {
                        const minutes = parseInt(timeMatch[1]);
                        const seconds = parseInt(timeMatch[2]);
                        const milliseconds = parseInt(timeMatch[3]);
                        text = timeMatch[4].trim();
                        time = minutes * 60 + seconds + milliseconds / 1000;
                    } else {
                        // 检测两位毫秒格式 [mm:ss.xx]
                        timeMatch = line.match(/\[(\d{2}):(\d{2})\.(\d{2})\](.*)/);
                        if (timeMatch) {
                            const minutes = parseInt(timeMatch[1]);
                            const seconds = parseInt(timeMatch[2]);
                            const milliseconds = parseInt(timeMatch[3]) * 10;
                            text = timeMatch[4].trim();
                            time = minutes * 60 + seconds + milliseconds / 1000;
                        } else {
                            // 检测冒号格式 [mm:ss:xx]
                            timeMatch = line.match(/\[(\d{2}):(\d{2}):(\d{2})\](.*)/);
                            if (timeMatch) {
                                const minutes = parseInt(timeMatch[1]);
                                const seconds = parseInt(timeMatch[2]);
                                const centiseconds = parseInt(timeMatch[3]);
                                text = timeMatch[4].trim();
                                time = minutes * 60 + seconds + centiseconds / 100;
                            }
                        }
                    }
                    
                    if (timeMatch && text && 
                        !text.match(/^(ti|ar|al|by|offset|作词|作曲|编曲):/i) && 
                        text !== '~~End~~' && 
                        text !== '-' &&
                        !text.match(/^[~\-=\s]*$/) && 
                        !text.includes('词：') && 
                        !text.includes('曲：') && 
                        !text.includes('编曲：') && 
                        !text.includes('Composed by') &&
                        !text.match(/^\w+\s*-\s*\w+$/)) {
                        lyrics.push({ time, text });
                    }
                });
                
                return lyrics.sort((a, b) => a.time - b.time);
            }

            // 显示歌词
            displayLyrics() {
                if (this.lyrics.length === 0) {
                    this.displayNoLyrics();
                    return;
                }
                
                this.lyricsContent.innerHTML = '';
                this.lyrics.forEach((lyric, index) => {
                    const lyricLine = document.createElement('div');
                    lyricLine.className = 'lyrics-line';
                    lyricLine.textContent = lyric.text;
                    lyricLine.addEventListener('click', () => {
                        this.audio.currentTime = lyric.time;
                    });
                    this.lyricsContent.appendChild(lyricLine);
                });
                
                // 确保歌词容器可见
                const lyricsSection = document.querySelector('.lyrics-section');
                if (lyricsSection) {
                    lyricsSection.style.display = 'block';
                }
            }

            displayNoLyrics() {
                this.lyricsContent.innerHTML = '<div class="lyrics-line">暂无歌词</div>';
            }

            // 更新歌词高亮
            updateLyrics() {
                if (this.lyrics.length === 0) return;
                
                const currentTime = this.audio.currentTime;
                let newIndex = -1;
                
                // 找到当前应该高亮的歌词行
                for (let i = 0; i < this.lyrics.length; i++) {
                    if (currentTime >= this.lyrics[i].time) {
                        newIndex = i;
                    } else {
                        break;
                    }
                }
                
                if (newIndex !== this.currentLyricIndex) {
                    // 移除之前的高亮
                    const prevActive = this.lyricsContent.querySelector('.lyrics-line.active');
                    if (prevActive) {
                        prevActive.classList.remove('active');
                    }
                    
                    // 添加新的高亮
                    if (newIndex >= 0) {
                        const lines = this.lyricsContent.querySelectorAll('.lyrics-line');
                        if (lines[newIndex]) {
                            lines[newIndex].classList.add('active');
                            
                            // 改进的滚动逻辑
                            this.scrollToLyric(lines[newIndex], newIndex);
                        }
                    }
                    
                    this.currentLyricIndex = newIndex;
                }
            }

            // 新增专门的滚动方法
            scrollToLyric(lyricElement, index) {
                const container = this.lyricsContent.parentElement;
                const containerHeight = container.clientHeight;
                const elementTop = lyricElement.offsetTop;
                const elementHeight = lyricElement.clientHeight;
                
                // 计算滚动位置，让当前歌词显示在容器中央
                const scrollTop = elementTop - (containerHeight / 2) + (elementHeight / 2);
                
                // 平滑滚动
                container.scrollTo({
                    top: Math.max(0, scrollTop),
                    behavior: 'smooth'
                });
                
                // 备用方案：如果scrollTo不工作，使用scrollIntoView
                setTimeout(() => {
                    if (Math.abs(container.scrollTop - scrollTop) > 10) {
                        lyricElement.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center',
                            inline: 'nearest'
                        });
                    }
                }, 100);
            }

            // 搜索功能（仅用于播放列表）
            handleSearch(query) {
                const searchTerm = query.toLowerCase().trim();
                
                if (searchTerm === '') {
                    this.filteredPlaylist = [...this.playlistData];
                } else {
                    this.filteredPlaylist = this.playlistData.filter(song => 
                        song.title.toLowerCase().includes(searchTerm) || 
                        song.artist.toLowerCase().includes(searchTerm)
                    );
                }
                
                this.renderFilteredPlaylist();
            }

            renderFilteredPlaylist() {
                this.playlistElement.innerHTML = '';
                this.filteredPlaylist.forEach((song, filteredIndex) => {
                    const originalIndex = this.playlistData.indexOf(song);
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    if (originalIndex === this.currentIndex) item.classList.add('active');
                    item.innerHTML = `<div class="song-number">${originalIndex + 1}</div><div class="song-name">${song.title}</div>`;
                    item.addEventListener('click', () => this.playSong(originalIndex));
                    this.playlistElement.appendChild(item);
                });
            }

            renderPlaylist() {
                this.filteredPlaylist = [...this.playlistData];
                this.renderFilteredPlaylist();
            }

            loadSongInfo(index) {
                const song = this.playlistData[index];
                this.songTitle.textContent = song.title;
                this.songArtist.textContent = song.artist;
                this.audio.src = './' + song.url;
                this.renderPlaylist();
                this.setupMediaSession();
                
                // 加载歌词
                this.loadLyrics(song.url);
            }

            play() {
                this.audio.play().catch(e => {
                    console.error("Play failed:", e);
                    this.statusBar.textContent = '播放失败';
                });
                this.isPlaying = true;
                this.playBtn.innerHTML = '⏸️';
            }

            pause() {
                this.audio.pause();
                this.isPlaying = false;
                this.playBtn.innerHTML = '▶️';
            }

            togglePlay() {
                this.isPlaying ? this.pause() : this.play();
            }

            playSong(index) {
                this.currentIndex = index;
                this.loadSongInfo(index);
                this.play();
            }

            // 添加缺失的方法
            previousSong() {
                if (this.playMode === 1) {
                    let newIndex;
                    do { newIndex = Math.floor(Math.random() * this.playlistData.length); }
                    while (this.playlistData.length > 1 && newIndex === this.currentIndex);
                    this.currentIndex = newIndex;
                } else {
                    this.currentIndex = this.currentIndex === 0 ? this.playlistData.length - 1 : this.currentIndex - 1;
                }
                this.playSong(this.currentIndex);
            }

            nextSong() {
                if (this.playMode === 1) {
                    let newIndex;
                    do { newIndex = Math.floor(Math.random() * this.playlistData.length); }
                    while (this.playlistData.length > 1 && newIndex === this.currentIndex);
                    this.currentIndex = newIndex;
                } else {
                    this.currentIndex = (this.currentIndex + 1) % this.playlistData.length;
                }
                this.playSong(this.currentIndex);
            }

            handleSongEnd() {
                this.playMode === 2 ? this.playSong(this.currentIndex) : this.nextSong();
            }

            togglePlayMode() {
                this.playMode = (this.playMode + 1) % 3;
                this.modeBtn.innerHTML = this.modeIcons[this.playMode];
                const modeText = ['顺序播放', '随机播放', '单曲循环'];
                this.statusBar.textContent = modeText[this.playMode];
            }

            updateProgress() {
                const progressPercent = (this.audio.currentTime / this.audio.duration) * 100 || 0;
                this.progressBar.style.width = `${progressPercent}%`;
                this.progressThumb.style.left = `${progressPercent}%`;
                this.currentTime.textContent = this.formatTime(this.audio.currentTime);
            }

            handleDragStart(e) {
                this.isDragging = true;
                this.progressContainer.classList.add('is-dragging');
                this.seekToPosition(e);
            }

            handleDragMove(e) {
                if (this.isDragging) this.seekToPosition(e);
            }

            handleDragEnd() {
                this.isDragging = false;
                this.progressContainer.classList.remove('is-dragging');
            }

            seekToPosition(e) {
                const rect = this.progressContainer.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let percent = (clientX - rect.left) / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                this.audio.currentTime = percent * this.audio.duration;
                this.updateProgress();
            }

            setupMediaSession() {
                if ('mediaSession' in navigator) {
                    const currentSong = this.playlistData[this.currentIndex];
                    navigator.mediaSession.metadata = new MediaMetadata({

                        artist: currentSong.artist,

                        ]
                    });

                    // 设置媒体控制动作
                    navigator.mediaSession.setActionHandler('play', () => {
                        this.play();
                    });
                    
                    navigator.mediaSession.setActionHandler('pause', () => {
                        this.pause();
                    });
                    
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        this.previousSong();
                    });
                    
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        this.nextSong();
                    });
                    
                    navigator.mediaSession.setActionHandler('seekto', (details) => {
                        if (details.seekTime) {
                            this.audio.currentTime = details.seekTime;
                        }
                    });
                }
            }

            formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
